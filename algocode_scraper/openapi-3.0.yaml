    StatementVariant:
      additionalProperties: false
      properties:
        format:
          description: Statement format. Markdown is the recommended one to interpret, as PDFs are usually served only for historical purposes.
          enum:
            - md
            - pdf
          type: string
        language:
          description: Statement language
          enum:
            - en
            - ro
          type: string
        lastUpdatedAt:
          description: Last updated time of the underlying file for the statement.
          format: date-time
          type: string
        permalink:
          description: Link to the statement's contents, raw. It is not guaranteed that this URL will remain the same.
          type: string
        renderURL:
          description: For markdown statements, this URL represents the HTML rendered version of this statement. See additional documentation for how to correctly render the HTML. It is not guaranteed that this URL will remain the same.
          type: string
        type:
          description: Usually empty, can be used to distinguish between multiple loose types of variants.
          type: string
      required:
