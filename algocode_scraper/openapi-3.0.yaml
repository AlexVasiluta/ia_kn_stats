          format: int64
          type: integer
        mentor:
          type: boolean
        name:
          type: string
        proposer:
          type: boolean
      required:
        - id
        - name
        - admin
        - proposer
        - mentor
        - display_name
        - generated
      type: object
    UsersGetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://code.algolymp.com/api/v2/public/schemas/UsersGetInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          items:
            format: int64
            type: integer
          type: array
        limit:
          format: int64
          maximum: 50
          minimum: 0
          type: integer
        name:
          type: string
        name_fuzzy:
          type: string
        offset:
          format: int64
          minimum: 0
          type: integer
      type: object
    UsersGetOutputBody:
      additionalProperties: false
      properties:
