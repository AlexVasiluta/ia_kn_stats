          type: boolean
        leaderboard_freeze:
          format: date-time
          nullable: true
          type: string
        leaderboard_style:
          type: string
        max_subs:
          format: int64
          type: integer
        mentor_only:
          type: boolean
        name:
          type: string
        per_user_time:
          format: int64
          type: integer
        public_join:
          type: boolean
        public_leaderboard:
          type: boolean
        question_cooldown:
          format: int64
          type: integer
        register_during_contest:
          type: boolean
        start_time:
          format: date-time
          type: string
        submission_cooldown:
          format: int64
          type: integer
        testers:
          items:
            $ref: "#/components/schemas/UserBrief"
          nullable: true
          type: array
        type:
          type: string
        visible:
          type: boolean
      required:
        - id
        - created_at
        - name
        - editors
        - testers
        - description
        - public_join
        - register_during_contest
        - visible
        - mentor_only
        - public_leaderboard
